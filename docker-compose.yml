services:
  superapp-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: superapp-sql-server
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SuperApp_Prod_Password_2026!"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - superapp_sqldata:/var/opt/mssql
      - ./database/SuperApp_Database.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'SuperApp_Prod_Password_2026!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - superapp-network

  superapp-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: superapp-backend-api
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=superapp-db,1433;Database=SuperAppDB;User Id=sa;Password=SuperApp_Prod_Password_2026!;TrustServerCertificate=true;MultipleActiveResultSets=true;
      - Jwt__Secret=SuperApp_Production_Master_Secret_Key_2026_Minimum_64_Chars_For_HmacSha256_Compliance_Secure_Token
      - Jwt__Issuer=SuperAppProduction
      - Jwt__Audience=SuperAppAudience
      - Jwt__ExpiryDays=30
      - Providers__Storage=Local
      - Providers__Otp=Mock
      - Providers__Map=Mock
      - Providers__Payment=Mock
      - Providers__Notification=Mock
    depends_on:
      superapp-db:
        condition: service_healthy
    volumes:
      - superapp_uploads:/app/wwwroot/uploads
    networks:
      - superapp-network

networks:
  superapp-network:
    driver: bridge

volumes:
  superapp_sqldata:
    name: superapp_sqldata
  superapp_uploads:
    name: superapp_uploads
